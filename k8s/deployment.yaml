# ============================================================
#  ScholarZ — Kubernetes Deployment
#  4 replicas of the scholarz container
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholarz
  namespace: default
  labels:
    app: scholarz
spec:
  replicas: 4
  selector:
    matchLabels:
      app: scholarz
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: scholarz
    spec:
      containers:
        - name: scholarz
          image: 910168469763.dkr.ecr.ap-south-1.amazonaws.com/scholarz:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
