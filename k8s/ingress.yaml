# ============================================================
#  ScholarZ — NGINX Ingress (Load Balancer)
#  Routes all external HTTP traffic to the scholarz service
#  Acts as the load balancer across all 4 pods
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scholarz-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scholarz-service
                port:
                  number: 80
