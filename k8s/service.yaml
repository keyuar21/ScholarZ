# ============================================================
#  ScholarZ — Kubernetes Service (ClusterIP)
#  Internal service used by the Ingress load balancer
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: scholarz-service
  namespace: default
  labels:
    app: scholarz
spec:
  selector:
    app: scholarz
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
