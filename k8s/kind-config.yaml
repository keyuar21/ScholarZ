# ============================================================
#  Kind Cluster Configuration — ScholarZ
#  1 control-plane + 2 worker nodes
#  Ports 80 and 443 mapped to the EC2 host
# ============================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: scholarz-cluster

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
  - role: worker
